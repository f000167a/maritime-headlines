name: コード検証

on:
  pull_request:
  push:
    branches: [main, 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Unit and parser regression tests
        env:
          REQUIRE_PARSER_TESTS: '1'
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check src/maritime_headlines/assets/app.js
      - name: Render migrated history without network
        run: maritime-headlines --legacy-state data/legacy_seen_articles.json --render-only --output dist
